 const menu=document.getElementById('home-full-menu');
 const open=document.querySelector('.home-menu-toggle');
 const close=document.querySelector('.home-menu-close');
 if(!menu||!open||!close)return;
 function setOpen(show){
   menu.classList.toggle('is-open',show);
   menu.setAttribute('aria-hidden',String(!show));
   open.setAttribute('aria-expanded',String(show));
   document.body.classList.toggle('home-menu-open',show);
   if(show)close.focus(); else open.focus();
 }
 open.addEventListener('click',()=>setOpen(true));
 close.addEventListener('click',()=>setOpen(false));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu.classList.contains('is-open'))setOpen(false)});
 menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{menu.classList.remove('is-open');document.body.classList.remove('home-menu-open')}));
})();</script></body></html>
